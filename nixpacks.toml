[phases.setup]
nixPkgs = [
  "...",
  "php82",
  "php82Extensions.pdo_mysql",
  "php82Extensions.mysqli",
  "php82Extensions.mbstring",
  "php82Extensions.bcmath",
  "php82Extensions.zip",
  "php82Extensions.gd",
  "php82Extensions.curl",
  "php82Extensions.xml",
  "php82Extensions.fileinfo",
  "php82Extensions.tokenizer",
  "php82Extensions.openssl"
]

[phases.build]
cmds = ["composer install --no-dev --optimize-autoloader"]

[start]
cmd = "php artisan config:cache && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"