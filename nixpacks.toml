[phases.setup]
nixPkgs = [
  "...",
  "(php82.withExtensions (exts: with exts; [ pdo_mysql mysqlnd mysqli mbstring bcmath zip gd curl xml fileinfo tokenizer openssl dom simplexml xmlwriter xmlreader ctype filter session iconv ]))"
]

[phases.build]
cmds = ["composer install --no-dev --optimize-autoloader"]

[start]
cmd = "php artisan config:cache && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"